<!DOCTYPE html>
<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css?family=Montserrat:500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                let correct = document.querySelector('.correct');
                correct.addEventListener('click', function() {
                    correct.style.backgroundColor = 'green';
                    document.querySelector('#feedback1').textContent = 'Correct!';
                });
                let incorrects = document.querySelectorAll('.incorrect');
                for (let i = 0; i < incorrects.length; i++) {
                    incorrects[i].addEventListener('click', function() {
                        incorrects[i].style.backgroundColor = 'red';
                        document.querySelector('#feedback1').textContent = 'Incorrect';
                    });
                }
                document.querySelector('#check').addEventListener('click', function() {
                    let input = document.querySelector('#answer');
                    if (input.value.trim().toLowerCase() === 'islamabad') {
                        input.style.backgroundColor = 'green';
                        document.querySelector('#feedback2').textContent = 'Correct!';
                    } else {
                        input.style.backgroundColor = 'red';
                        document.querySelector('#feedback2').textContent = 'Incorrect';
                    }
                });
            });
        </script>
    </head>
    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>
        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice</h2>
                <hr>
                <h3>In CS50 Week 1, which programming language did you first use to print "hello, world"?</h3>
                <button class="incorrect">Scratch</button>
                <button class="correct">C</button>
                <button class="incorrect">Python</button>
                <button class="incorrect">SQL</button>
                <p id="feedback1"></p>
            </div>
            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <h3>What is the capital city of Pakistan?</h3>
                <input id="answer" type="text" placeholder="Type your answer">
                <button id="check">Check Answer</button>
                <p id="feedback2"></p>
            </div>
        </div>
    </body>
</html>
