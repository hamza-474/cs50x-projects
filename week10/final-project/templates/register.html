{% extends "layout.html" %}
{% block title %}Register{% endblock %}
{% block main %}
<h1 class="mb-3">Register</h1>
<p class="text-muted">Create a Kharcha account. Your password is stored only as a hash, never in plain text.</p>
<form action="/register" method="post" class="col-md-6">
<div class="mb-3"><label class="form-label" for="username">Username</label><input class="form-control" id="username" name="username" required autofocus></div>
<div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" required></div>
<div class="mb-3"><label class="form-label" for="confirmation">Confirm password</label><input class="form-control" id="confirmation" name="confirmation" type="password" required></div>
<button class="btn btn-success" type="submit">Register</button>
</form>
<p class="mt-3">Already have an account? <a href="/login">Log in</a>.</p>
{% endblock %}
