{% extends "layout.html" %}
{% block title %}Add entry{% endblock %}
{% block main %}
<h1 class="mb-3">Add entry</h1>
<form action="/add" method="post" class="col-md-6">
<div class="mb-3"><label class="form-label" for="kind">Type</label><select class="form-select" id="kind" name="kind"><option value="expense" selected>Expense</option><option value="income">Income</option></select></div>
<div class="mb-3"><label class="form-label" for="amount">Amount (Rs)</label><input class="form-control" id="amount" name="amount" type="number" min="0.01" step="0.01" required></div>
<div class="mb-3"><label class="form-label" for="category">Category</label><select class="form-select" id="category" name="category">{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select></div>
<div class="mb-3"><label class="form-label" for="note">Note</label><input class="form-control" id="note" name="note" maxlength="120" placeholder="e.g. Groceries at the market"></div>
<div class="mb-3"><label class="form-label" for="date">Date</label><input class="form-control" id="date" name="date" type="date" value="{{ today }}"></div>
<button class="btn btn-success" type="submit">Save entry</button>
<a class="btn btn-outline-secondary" href="/">Cancel</a>
</form>
{% endblock %}
